name: Basic checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows-stdlib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m py_compile Scripts/setup_viewer.py Scripts/test_archive.py Scripts/bake_face_coordinates.py Scripts/generate_face_map.py Scripts/generate_enhancement.py Scripts/test_enhancement.py Scripts/test_enhancement_service.py
      - name: Test Windows ZIP extraction
        run: python Scripts/test_archive.py

      - name: Test enhancement cache and archive boundaries
        run: python Scripts/test_enhancement_service.py
